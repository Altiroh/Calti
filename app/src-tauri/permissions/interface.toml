# Toutes les commandes de Calti, pour les vues de son interface seulement (voir capabilities/default.json).
[[set]]
identifier = "interface"
description = "Commandes de Calti, réservées à son interface."
permissions = [
  "allow-alt-held",
  "allow-blocker-configure",
  "allow-brave-bookmarks",
  "allow-brave-history",
  "allow-brave-profiles",
  "allow-browser-action",
  "allow-browser-close",
  "allow-browser-eval",
  "allow-browser-layout",
  "allow-browser-move",
  "allow-browser-navigate",
  "allow-browser-new-window",
  "allow-browser-open",
  "allow-browser-tabs",
  "allow-clear-browsing-data",
  "allow-clipboard-image",
  "allow-clipboard-pause",
  "allow-ctrl-held",
  "allow-devtools-toggle",
  "allow-devtools-undock",
  "allow-disk-free",
  "allow-download-cancel",
  "allow-download-open",
  "allow-downloads-clear",
  "allow-downloads-list",
  "allow-image-delete",
  "allow-image-list",
  "allow-image-load",
  "allow-image-save",
  "allow-media-control",
  "allow-media-state",
  "allow-page-menu-pick",
  "allow-password-import-result",
  "allow-queue-password-import",
  "allow-register-default-browser",
  "allow-restart-app",
  "allow-search-suggestions",
  "allow-site-permission-set",
  "allow-site-permissions",
  "allow-state-load",
  "allow-state-log",
  "allow-state-save",
  "allow-take-launch-urls",
  "allow-taskbar-overlay",
  "allow-ui-devtools",
  "allow-window-identity",
  "allow-zoom-set",
  "allow-zoom-settings",
]

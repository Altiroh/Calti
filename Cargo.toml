[workspace]
resolver = "2"
members = ["app/src-tauri", "host", "crates/bridge"]

# Pas d'informations de débogage en dev : le disque C: est presque plein.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

# Version installée : exécutable plus léger, sans symboles de débogage.
[profile.release]
strip = true
